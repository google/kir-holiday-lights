// One controller. Load it with: fppcfg ./station.cfg diff

// The board's eth0 link-local address: it stays put when the static address
// below changes. No zone; the tool finds which of your interfaces reaches it.
address: "fe80::ba27:ebff:fe12:3456"

settings: HostDescription: "K16 N Tunnel"

network: interfaces: eth0: {
	proto:   "static"
	address: "192.168.1.32"
	netmask: "255.255.255.0"
}
