// The standby controller: a spare board kept configured, ready to take over
// from one that fails. It takes its address from DHCP, so there is no fixed
// address to reach it at. Say where it is on each run:
//
//     fppcfg ./standby.cfg diff --at ADDRESS

settings: {
	HostName:        "FPP-Spare"
	HostDescription: "Standby"
}

network: {
	interfaces: eth0: proto: "dhcp"
	gateway: "dhcp"
	dns:     "dhcp"
}
