// Show player (192.168.1.192): the Raspberry Pi 5 that runs the show. The only
// controller in player mode, and the only one that sends MultiSync.

settings: {
	HostName:           "FPP-ShowPlayer"
	HostDescription:    "Main Show controller"
	fppMode:            "player"
	// Multicast only. FPP 10 defaults unicast on, so it is turned off
	// explicitly; broadcast is the third of the same checkboxes.
	MultiSyncEnabled:   true
	MultiSyncMulticast: true
	MultiSyncBroadcast: false
	MultiSyncUnicast:   false
	// The USB audio device ("USB Audio Device"); the HDMI outputs are
	// vc4hdmi0 and vc4hdmi1.
	AudioOutput:        "Device"
}

volume: 52

network: interfaces: eth0: {
	proto:   "static"
	address: "192.168.1.192"
	netmask: "255.255.255.0"
}

