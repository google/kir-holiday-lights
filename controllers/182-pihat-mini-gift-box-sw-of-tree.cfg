// PiHat Mini Gift Box, SW of Tree (192.168.1.182).

settings: HostDescription: "PiHat Mini Gift Box, SW of Tree"

// Wired and WiFi; xLights talks to the WiFi address.
network: interfaces: {
	eth0: {
		proto:   "static"
		address: "192.168.1.182"
		netmask: "255.255.255.0"
	}
	wlan0: address: "192.168.1.82"
}
